name: Site checks
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, "codex/**"]
permissions:
  contents: read
jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/dist/package-lock.json
      - name: Install CMS dependencies
        run: npm ci --prefix site/dist --no-audit
      - name: Verify content rendering
        run: |
          npm --prefix site/dist test
          npm --prefix site/dist run build
          python3 scripts/check-site.py site/dist/public
      - name: Compile editor
        env:
          SANITY_STUDIO_PROJECT_ID: testcms1
          SANITY_STUDIO_DATASET: development
        run: npm --prefix site/dist run studio:build
      - name: Check JavaScript syntax
        run: |
          node --check site/dist/app.js
          node --check site/dist/translations.js
          node --check site/dist/pages.js
      - name: Check assets and section links
        run: python3 scripts/check-site.py
